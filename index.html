
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LINNOX ARTS - Contact Us</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>LINNOX ARTS</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="contact-container">

        <section class="contact-info">

            <h1>Get In Touch</h1>

            <p>
                We would love to hear from you.
                Send us a message anytime.
            </p>

            <h3>Email</h3>
            <p>hello@mywebsite.com</p>

            <h3>Phone</h3>
            <p>+254 700 000 000</p>

            <h3>Location</h3>
            <p>Kenya</p>

        </section>

        <section class="contact-form">

            <h2>Send Us a Message</h2>

            <form>

                <input type="text"
                    placeholder="Your Name" required>

                <input type="email"
                    placeholder="Your Email" required>

                <input type="text"
                    placeholder="Subject">

                <textarea
                    placeholder="Your Message"
                    required></textarea>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js"></script>
<script src="script.js"></script>

</body>
</html>
